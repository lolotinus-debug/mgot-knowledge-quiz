<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Quiz ULTRA PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* BACKGROUND */
.background-glow{
position:fixed;
width:800px;
height:800px;
border-radius:50%;
background:radial-gradient(circle, rgba(34,197,94,.25), transparent 70%);
top:-250px;
left:-200px;
filter:blur(80px);
z-index:-1;
}

.card{
max-width:850px;
margin:20px auto;
padding:25px;
background:rgba(15,23,42,.95);
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
animation:fadeIn .4s ease;
}

.hidden{display:none;}

header{
text-align:center;
padding:30px;
}

header h1{
font-size:2.5rem;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
transition:.3s;
}

button:hover{transform:scale(1.03);}

/* INPUT */
input{
width:100%;
padding:12px;
margin-top:15px;
border-radius:12px;
border:none;
background:#0f172a;
color:white;
}

/* TOP BAR */
.top{
display:flex;
justify-content:space-between;
margin-bottom:15px;
gap:10px;
flex-wrap:wrap;
}

.top div{
background:#0f172a;
padding:10px;
border-radius:10px;
font-weight:700;
}

/* PROGRESS */
.bar{
height:12px;
background:#0f172a;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

#progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#3b82f6);
transition:.3s;
}

/* QUESTIONS */
#question{
text-align:center;
margin-bottom:20px;
font-size:1.4rem;
}

.answers{
display:grid;
gap:12px;
}

.answers button{
background:#0f172a;
color:white;
text-align:left;
border:1px solid rgba(255,255,255,.1);
}

.correct{background:#16a34a !important;}
.wrong{background:#dc2626 !important;}

/* RESULT */
#result{
text-align:center;
}

.badge{
display:inline-block;
padding:10px 15px;
background:linear-gradient(45deg,#f59e0b,#facc15);
color:#111;
border-radius:999px;
font-weight:800;
margin-top:10px;
}

/* LEADERBOARD */
li{
background:#0f172a;
padding:10px;
margin:8px 0;
border-radius:10px;
list-style:none;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<div class="background-glow"></div>

<header>
<h1>🧠 MGOT ULTRA PRO QUIZ</h1>
<p>Test your mindset. Earn XP. Become Legend.</p>
</header>

<!-- START -->
<div id="start" class="card">
<h2>Enter your name</h2>
<input id="name" placeholder="Your name">
<button onclick="start()">Start Quiz</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="card hidden">

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Rank: <span id="rank">Beginner</span></div>
<div>Time: <span id="time">15</span></div>
</div>

<div class="bar"><div id="progress"></div></div>

<h2 id="question"></h2>

<div class="answers" id="answers"></div>
</div>

<!-- RESULT -->
<div id="result" class="card hidden">
<h2>Quiz Finished 🎉</h2>
<p>Total XP: <span id="finalXp"></span></p>
<p>Rank: <span id="finalRank"></span></p>
<div id="badge" class="badge"></div>
<button onclick="restart()">Play Again</button>
</div>

<!-- LEADERBOARD -->
<div class="card">
<h2>🏆 Leaderboard</h2>
<ul id="board"></ul>
</div>

<audio id="correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="wrong" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>


const q = [

{
cat:"MGOT",
q:"What does MGOT stand for?",
a:[
"Mindset Growth Optimization Token",
"Money Growth Online Token",
"Meta Global Option Trade",
"Market Growth Operation"
],
c:0
},

{
cat:"Science",
q:"What is H2O?",
a:["Oxygen","Hydrogen","Water","Salt"],
c:2
},

{
cat:"Geography",
q:"What is the capital of Slovakia?",
a:["Bratislava","Košice","Praha","Budapest"],
c:0
},

{
cat:"Health",
q:"How many hours of sleep is recommended for adults?",
a:["3-4","5-6","7-9","10-12"],
c:2
},

{
cat:"Culture",
q:"What country is sushi from?",
a:["China","Japan","Korea","Thailand"],
c:1
},

{
cat:"Food",
q:"What is the main ingredient of guacamole?",
a:["Tomato","Avocado","Potato","Cucumber"],
c:1
},

{
cat:"Technology",
q:"What does AI stand for?",
a:[
"Auto Input",
"Artificial Intelligence",
"Advanced Internet",
"Active Interface"
],
c:1
},

{
cat:"Psychology",
q:"What is cognitive bias?",
a:[
"Random thinking error",
"Systematic error in thinking",
"Perfect logic",
"Memory upgrade"
],
c:1
},

{
cat:"Art",
q:"Who painted Mona Lisa?",
a:[
"Van Gogh",
"Picasso",
"Leonardo da Vinci",
"Michelangelo"
],
c:2
},

{
cat:"Science",
q:"What planet is known as the Red Planet?",
a:["Venus","Mars","Jupiter","Mercury"],
c:1
},
{
cat:"Science",
q:"What gas do plants absorb from the atmosphere?",
a:["Oxygen","Nitrogen","Carbon Dioxide","Hydrogen"],
c:2
},

{
cat:"Science",
q:"What is the center of an atom called?",
a:["Electron","Nucleus","Proton","Shell"],
c:1
},

{
cat:"Science",
q:"How many planets are in the Solar System?",
a:["7","8","9","10"],
c:1
},

{
cat:"Science",
q:"What is the chemical symbol for gold?",
a:["Ag","Au","Go","Gd"],
c:1
},

{
cat:"Science",
q:"What force keeps planets in orbit around the Sun?",
a:["Magnetism","Electricity","Gravity","Pressure"],
c:2
},

{
cat:"Science",
q:"What is the boiling point of water at sea level?",
a:["50°C","75°C","100°C","150°C"],
c:2
},

{
cat:"Science",
q:"What is the largest organ in the human body?",
a:["Heart","Liver","Skin","Brain"],
c:2
},

{
cat:"Science",
q:"What particle has a negative charge?",
a:["Proton","Neutron","Electron","Photon"],
c:2
},

{
cat:"Science",
q:"Which planet is the largest in our Solar System?",
a:["Earth","Mars","Saturn","Jupiter"],
c:3
},

{
cat:"Science",
q:"What is the nearest star to Earth?",
a:["Sirius","Polaris","The Sun","Alpha Centauri"],
c:2
}
];

let i=0,xp=0,timer;
let playerName="";
  
function start(){

playerName =
document.getElementById("name").value || "Anonymous";

document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");

q.sort(() => Math.random() - 0.5);

load();
}

function load(){
clearInterval(timer);
let time=15;
document.getElementById("time").innerText=time;

timer=setInterval(()=>{
time--;
document.getElementById("time").innerText=time;
if(time<=0){next();}
},1000);

let cur=q[i];
document.getElementById("question").innerHTML =
`<div style="font-size:14px;color:#22c55e;margin-bottom:8px">
${cur.cat}
</div>
${cur.q}`;
  
let box=document.getElementById("answers");
box.innerHTML="";

cur.a.forEach((x,idx)=>{
let b=document.createElement("button");
b.innerText=x;
b.onclick=()=>check(idx);
box.appendChild(b);
});

document.getElementById("progress").style.width=((i+1)/q.length)*100+"%";
}

function check(idx){
clearInterval(timer);
let buttons=document.querySelectorAll(".answers button");

buttons.forEach(b=>b.disabled=true);

if(idx===q[i].c){
document.getElementById("correct").play();
buttons[idx].classList.add("correct");
xp+=10;
document.getElementById("xp").innerText=xp;
}else{
document.getElementById("wrong").play();
buttons[idx].classList.add("wrong");
buttons[q[i].c].classList.add("correct");
}

setTimeout(next,800);
}

function next(){
i++;
if(i>=q.length)finish();
else load();
}

function finish(){

document.getElementById("quiz").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

let rank="Beginner";
let badge="Recruit";

if(xp>=30){rank="Supporter";badge="🔥 Supporter";}
if(xp>=60){rank="Warrior";badge="⚔️ Warrior";}
if(xp>=90){rank="Legend";badge="👑 Legend";}

document.getElementById("finalXp").innerText=xp;
document.getElementById("finalRank").innerText=rank;
document.getElementById("badge").innerText=badge;

save(rank);
}

function save(rank){
let board=JSON.parse(localStorage.getItem("mgot"))||[];
board.push({
name:playerName,
xp:xp,
rank:rank
});
board.sort((a,b)=>b.xp-a.xp);
localStorage.setItem("mgot",JSON.stringify(board));
render();
}

function render(){
let board=JSON.parse(localStorage.getItem("mgot"))||[];
let list=document.getElementById("board");
list.innerHTML="";
board.slice(0,10).forEach(p=>{
list.innerHTML+=`<li>${p.name} - ${p.xp} XP (${p.rank})</li>`;
});
}

function restart(){
location.reload();
}

render();

</script>

</body>
</html>
